<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown 在线编辑器</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/highlight.min.js"></script>
<style>
:root{
  --bg:#ffffff; --bg-soft:#f6f8fa; --fg:#1f2328; --muted:#656d76;
  --border:#d0d7de; --accent:#0969da; --pre-bg:#f6f8fa; --quote:#656d76;
}
[data-theme="dark"]{
  --bg:#0d1117; --bg-soft:#161b22; --fg:#e6edf3; --muted:#8b949e;
  --border:#30363d; --accent:#58a6ff; --pre-bg:#161b22; --quote:#8b949e;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--fg);
  display:flex;flex-direction:column;
}
.toolbar{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:8px 12px;border-bottom:1px solid var(--border);background:var(--bg-soft);
}
.tb-group{display:flex;gap:2px;padding-right:6px;margin-right:2px;border-right:1px solid var(--border)}
.tb-group:last-child{border-right:none}
button{
  font:inherit;font-size:13px;line-height:1;
  padding:6px 9px;border:1px solid transparent;border-radius:6px;
  background:transparent;color:var(--fg);cursor:pointer;
}
button:hover{background:var(--bg);border-color:var(--border)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08)}
.spacer{flex:1}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.main{flex:1;display:flex;min-height:0}
#editorPane{flex:0 0 50%;min-width:0;display:flex;flex-direction:column}
#previewPane{flex:1;min-width:0;overflow:auto;padding:24px 28px}
#gutter{flex:0 0 6px;cursor:col-resize;background:var(--border);transition:background .15s}
#gutter:hover,#gutter.dragging{background:var(--accent)}
#editor{
  flex:1;width:100%;resize:none;border:none;outline:none;
  padding:20px 22px;background:var(--bg);color:var(--fg);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  font-size:14px;line-height:1.75;tab-size:2;
}
/* ── 预览区排版 ── */
.md-body{max-width:820px;margin:0 auto;line-height:1.75;word-wrap:break-word}
.md-body>*:first-child{margin-top:0}
.md-body h1,.md-body h2,.md-body h3,.md-body h4,.md-body h5,.md-body h6{
  margin:24px 0 16px;font-weight:600;line-height:1.3
}
.md-body h1{font-size:1.9em;border-bottom:1px solid var(--border);padding-bottom:.3em}
.md-body h2{font-size:1.45em;border-bottom:1px solid var(--border);padding-bottom:.3em}
.md-body h3{font-size:1.2em}
.md-body h4{font-size:1em}
.md-body p,.md-body ul,.md-body ol,.md-body blockquote,.md-body table,.md-body pre{margin:0 0 16px}
.md-body a{color:var(--accent);text-decoration:none}
.md-body a:hover{text-decoration:underline}
.md-body ul,.md-body ol{padding-left:2em}
.md-body li{margin:.25em 0}
.md-body li>input{margin-right:.4em}
.md-body blockquote{
  padding:0 1em;color:var(--quote);border-left:.25em solid var(--border)
}
.md-body code{
  padding:.2em .4em;border-radius:6px;background:var(--pre-bg);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em
}
.md-body pre{
  padding:16px;overflow:auto;border-radius:8px;background:var(--pre-bg);
  border:1px solid var(--border)
}
.md-body pre code{padding:0;background:none;font-size:.88em;line-height:1.6}
.md-body table{border-collapse:collapse;display:block;overflow:auto;max-width:100%}
.md-body th,.md-body td{border:1px solid var(--border);padding:6px 13px}
.md-body th{background:var(--bg-soft);font-weight:600}
.md-body tr:nth-child(2n) td{background:var(--bg-soft)}
.md-body img{max-width:100%;border-radius:6px}
.md-body hr{height:1px;border:none;background:var(--border);margin:24px 0}
.md-body input[type=checkbox]{vertical-align:middle}
[data-theme="dark"] .md-body pre,[data-theme="dark"] .md-body code{background:#161b22;color:#e6edf3}
[data-theme="dark"] .hljs{background:#161b22;color:#e6edf3}
@media (max-width:860px){
  .main{flex-direction:column}
  #editorPane{flex:1 1 auto!important}
  #previewPane{flex:1 1 auto;border-top:1px solid var(--border)}
  #gutter{display:none}
}
</style>
</head>
<body>

<div class="toolbar">
  <div class="tb-group">
    <button data-cmd="h1" title="一级标题">H1</button>
    <button data-cmd="h2" title="二级标题">H2</button>
    <button data-cmd="h3" title="三级标题">H3</button>
  </div>
  <div class="tb-group">
    <button data-cmd="bold" title="加粗 (Ctrl+B)"><b>B</b></button>
    <button data-cmd="italic" title="斜体 (Ctrl+I)"><i>I</i></button>
    <button data-cmd="strike" title="删除线"><s>S</s></button>
  </div>
  <div class="tb-group">
    <button data-cmd="ul" title="无序列表">• 列表</button>
    <button data-cmd="ol" title="有序列表">1. 列表</button>
    <button data-cmd="task" title="任务列表">☑ 任务</button>
    <button data-cmd="quote" title="引用">❝ 引用</button>
    <button data-cmd="code" title="代码块">&lt;/&gt;</button>
    <button data-cmd="table" title="表格">▦ 表格</button>
    <button data-cmd="link" title="链接 (Ctrl+K)">🔗 链接</button>
    <button data-cmd="hr" title="分割线">—</button>
  </div>
  <span class="spacer"></span>
  <div class="tb-group">
    <span class="status" id="count">0 字</span>
    <span class="status" id="saved"></span>
  </div>
  <div class="tb-group">
    <button id="importBtn" title="导入本地 .md 文件">导入</button>
    <button id="htmlBtn" title="导出为 HTML">导出 HTML</button>
    <button class="primary" id="mdBtn" title="保存为 .md (Ctrl+S)">导出 .md</button>
    <button id="themeBtn" title="切换深浅色">🌓</button>
  </div>
</div>

<div class="main">
  <div id="editorPane">
    <textarea id="editor" spellcheck="false" placeholder="在这里写 Markdown…  支持直接把 .md 文件拖进窗口"></textarea>
  </div>
  <div id="gutter"></div>
  <div id="previewPane"><div class="md-body" id="preview"></div></div>
</div>

<input type="file" id="fileInput" accept=".md,.markdown,.txt,.mdown" hidden>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var editor = $('editor'), preview = $('preview'), previewPane = $('previewPane');
  var KEY_DOC = 'md-editor:doc', KEY_THEME = 'md-editor:theme', KEY_SPLIT = 'md-editor:split';

  /* ── 渲染管线：marked 解析 → 代码高亮 → DOMPurify 净化 ── */
  var hasMarked = typeof marked !== 'undefined';
  var hasPurify = typeof DOMPurify !== 'undefined';

  if (hasMarked) {
    var renderer = {
      code: function () {
        var a = arguments[0];
        var text = (a && typeof a === 'object') ? a.text : a;
        var lang = (a && typeof a === 'object') ? a.lang : arguments[1];
        var out = text;
        if (typeof hljs !== 'undefined' && lang && hljs.getLanguage(lang)) {
          try { out = hljs.highlight(text, { language: lang }).value; } catch (e) { out = text; }
        }
        return '<pre><code class="hljs language-' + (lang || '') + '">' + out + '</code></pre>';
      }
    };
    marked.use({ renderer: renderer, gfm: true, breaks: true });
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  // CDN 挂了也能用的兜底渲染
  function fallbackRender(src) {
    return '<pre style="white-space:pre-wrap">' + escapeHtml(src) + '</pre>';
  }

  function render() {
    var src = editor.value;
    var html = hasMarked ? marked.parse(src) : fallbackRender(src);
    preview.innerHTML = hasPurify ? DOMPurify.sanitize(html) : html;
  }

  /* ── 自动保存（localStorage，防抖 400ms）── */
  var saveTimer, flashTimer;
  function scheduleSave() {
    $('saved').textContent = '编辑中…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        localStorage.setItem(KEY_DOC, editor.value);
        $('saved').textContent = '已保存 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
        clearTimeout(flashTimer);
        flashTimer = setTimeout(function () { $('saved').textContent = ''; }, 2000);
      } catch (e) {
        $('saved').textContent = '保存失败（存储空间不足）';
      }
    }, 400);
  }

  function updateCount() {
    var t = editor.value;
    var chars = t.replace(/\s/g, '').length;
    var lines = t ? t.split('\n').length : 0;
    $('count').textContent = chars + ' 字 · ' + lines + ' 行 · 约 ' + Math.max(1, Math.round(chars / 400)) + ' 分钟';
  }

  editor.addEventListener('input', function () { render(); updateCount(); scheduleSave(); });

  /* ── 同步滚动（按滚动比例）── */
  var syncing = false;
  editor.addEventListener('scroll', function () {
    if (syncing) return;
    var max = editor.scrollHeight - editor.clientHeight;
    if (max <= 0) return;
    syncing = true;
    previewPane.scrollTop = (editor.scrollTop / max) * (previewPane.scrollHeight - previewPane.clientHeight);
    requestAnimationFrame(function () { syncing = false; });
  });
  previewPane.addEventListener('scroll', function () {
    if (syncing) return;
    var max = previewPane.scrollHeight - previewPane.clientHeight;
    if (max <= 0) return;
    syncing = true;
    editor.scrollTop = (previewPane.scrollTop / max) * (editor.scrollHeight - editor.clientHeight);
    requestAnimationFrame(function () { syncing = false; });
  });

  /* ── 工具栏插入 ── */
  var SNIPPETS = {
    h1: ['# ', ''], h2: ['## ', ''], h3: ['### ', ''],
    bold: ['**', '**'], italic: ['*', '*'], strike: ['~~', '~~'],
    ul: ['- ', ''], ol: ['1. ', ''], task: ['- [ ] ', ''], quote: ['> ', ''],
    code: ['```js\n', '\n```'], link: ['[', '](https://)'], hr: ['\n---\n', ''],
    table: ['| 列 A | 列 B |\n| --- | --- |\n|  |  |\n', '']
  };
  function insert(before, after, placeholder) {
    var s = editor.selectionStart, e = editor.selectionEnd;
    var mid = editor.value.slice(s, e) || placeholder || '';
    editor.value = editor.value.slice(0, s) + before + mid + after + editor.value.slice(e);
    var pos = s + before.length;
    editor.focus();
    editor.setSelectionRange(pos, pos + mid.length);
    render(); updateCount(); scheduleSave();
  }
  function wrap(before, after) {
    var s = editor.selectionStart, e = editor.selectionEnd;
    var sel = editor.value.slice(s, e);
    if (!sel) { insert(before, after, before === '**' ? '加粗' : '文字'); return; }
    editor.value = editor.value.slice(0, s) + before + sel + after + editor.value.slice(e);
    editor.focus(); editor.setSelectionRange(s + before.length, e + before.length);
    render(); updateCount(); scheduleSave();
  }

  document.querySelectorAll('[data-cmd]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var cmd = btn.dataset.cmd, cfg = SNIPPETS[cmd];
      if (cmd === 'bold' || cmd === 'italic' || cmd === 'strike') wrap(cfg[0], cfg[1]);
      else insert(cfg[0], cfg[1]);
    });
  });

  /* ── 编辑器快捷键 ── */
  editor.addEventListener('keydown', function (ev) {
    var meta = ev.ctrlKey || ev.metaKey;
    if (meta && ev.key.toLowerCase() === 's') { ev.preventDefault(); exportMd(); }
    else if (meta && ev.key.toLowerCase() === 'b') { ev.preventDefault(); wrap('**', '**'); }
    else if (meta && ev.key.toLowerCase() === 'i') { ev.preventDefault(); wrap('*', '*'); }
    else if (meta && ev.key.toLowerCase() === 'k') { ev.preventDefault(); insert('[', '](https://)', '链接文字'); }
    else if (ev.key === 'Tab') {
      ev.preventDefault();
      insert('  ', '', '');
    }
  });

  /* ── 下载 ── */
  function download(filename, text, mime) {
    var blob = new Blob([text], { type: mime + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  function baseName() {
    var first = (editor.value.match(/^\s*#\s+(.+)$/m) || [])[1];
    var name = (first || 'document').trim().replace(/[\\/:*?"<>|]/g, '').slice(0, 50);
    return name + '.md';
  }
  function exportMd() { download(baseName(), editor.value, 'text/markdown'); }

  $('mdBtn').addEventListener('click', exportMd);
  $('htmlBtn').addEventListener('click', function () {
    download(baseName().replace(/\.md$/, '.html'),
      '<!DOCTYPE html>\n<html lang="zh-CN"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<title>' + escapeHtml(baseName()) + '</title>' +
      '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/styles/github.min.css">' +
      '<style>body{max-width:820px;margin:40px auto;padding:0 20px;line-height:1.75;' +
      'font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}' +
      'pre{padding:16px;overflow:auto;background:#f6f8fa;border-radius:8px}' +
      'code{font-family:ui-monospace,Menlo,Consolas,monospace}' +
      'table{border-collapse:collapse}th,td{border:1px solid #d0d7de;padding:6px 13px}' +
      'img{max-width:100%}</style></head><body>\n' + preview.innerHTML + '\n</body></html>',
      'text/html');
  });

  /* ── 导入（按钮 + 拖拽）── */
  function loadText(text) {
    editor.value = text; render(); updateCount(); scheduleSave();
  }
  $('importBtn').addEventListener('click', function () { $('fileInput').click(); });
  $('fileInput').addEventListener('change', function (ev) {
    var f = ev.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () { loadText(r.result); };
    r.readAsText(f, 'utf-8');
    ev.target.value = '';
  });
  ['dragover', 'drop'].forEach(function (t) {
    document.addEventListener(t, function (ev) {
      ev.preventDefault();
      if (t === 'drop') {
        var f = ev.dataTransfer.files[0];
        if (f && /\.(md|markdown|txt|mdown)$/i.test(f.name)) {
          var r = new FileReader();
          r.onload = function () { loadText(r.result); };
          r.readAsText(f, 'utf-8');
        }
      }
    });
  });

  /* ── 分栏拖拽 ── */
  var gutter = $('gutter'), dragging = false;
  gutter.addEventListener('mousedown', function () { dragging = true; gutter.classList.add('dragging'); });
  document.addEventListener('mousemove', function (ev) {
    if (!dragging) return;
    var pct = Math.min(80, Math.max(20, (ev.clientX / window.innerWidth) * 100));
    $('editorPane').style.flex = '0 0 ' + pct + '%';
    localStorage.setItem(KEY_SPLIT, pct);
  });
  document.addEventListener('mouseup', function () { dragging = false; gutter.classList.remove('dragging'); });

  /* ── 主题 ── */
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem(KEY_THEME, t);
    $('themeBtn').textContent = t === 'dark' ? '☀️' : '🌓';
  }
  $('themeBtn').addEventListener('click', function () {
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  /* ── 启动 ── */
  var DEMO = '# 欢迎使用 Markdown 编辑器\n\n' +
    '左边写代码，右边实时预览。**改动会自动保存在本机浏览器里**，关掉页面、断网都不会丢。\n\n' +
    '> 这是一个纯前端工具：**你的内容不会上传到任何服务器**。想永久留存，请用顶部的「导出 .md」。\n\n' +
    '## 常用操作\n\n' +
    '- `Ctrl/⌘ + S` — 导出 `.md` 文件\n' +
    '- `Ctrl/⌘ + B / I / K` — 加粗 / 斜体 / 插链接\n' +
    '- 顶部工具栏可一键插入标题、列表、表格、代码块\n' +
    '- 把 `.md` 文件直接拖进窗口即可导入\n' +
    '- 中间的分隔条可以拖动，调整左右比例\n\n' +
    '## 表格\n\n' +
    '| 能力 | 是否支持 |\n| --- | --- |\n| 实时预览 | ✅ |\n| 导出 .md | ✅ |\n| 导出 HTML | ✅ |\n\n' +
    '## 代码\n\n```js\nconst hello = (name) => `Hi, ${name}`;\nconsole.log(hello("Markdown"));\n```\n\n' +
    '> 提示：内容存在本机浏览器，换设备或清理浏览器数据会丢失，重要文档记得导出 `.md` 保存。\n';

  var savedDoc = null;
  try { savedDoc = localStorage.getItem(KEY_DOC); } catch (e) {}
  editor.value = savedDoc === null ? DEMO : savedDoc;
  setTheme(localStorage.getItem(KEY_THEME) || 'light');
  var pct = localStorage.getItem(KEY_SPLIT);
  if (pct) $('editorPane').style.flex = '0 0 ' + pct + '%';
  render(); updateCount();
})();
</script>
</body>
</html>
